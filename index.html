<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#EDE5DD;font-family:'Inter',system-ui,sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#222;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState, useEffect, useRef} = React;

const PROFILE = {
  name: "Juan David Villa",
  totalPhotos: 807,
};

const VISITED = [
  {id:"724",name:"España",         multi:true, flag:"🇪🇸",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"250",name:"Francia",                   flag:"🇫🇷",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"276",name:"Alemania",                  flag:"🇩🇪",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"756",name:"Suiza",                     flag:"🇨🇭",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"203",name:"Chequia",                   flag:"🇨🇿",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"208",name:"Dinamarca",                 flag:"🇩🇰",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"578",name:"Noruega",                   flag:"🇳🇴",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"752",name:"Suecia",                    flag:"🇸🇪",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"528",name:"Países Bajos",              flag:"🇳🇱",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"056",name:"Bélgica",       multi:true, flag:"🇧🇪",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"348",name:"Hungría",                   flag:"🇭🇺",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"040",name:"Austria",                   flag:"🇦🇹",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"703",name:"Eslovaquia",                flag:"🇸🇰",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"380",name:"Italia",                    flag:"🇮🇹",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"336",name:"Vaticano",                  flag:"🇻🇦",year:2014,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"246",name:"Finlandia",                 flag:"🇫🇮",year:2018,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"643",name:"Rusia",                     flag:"🇷🇺",year:2018,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"826",name:"Inglaterra",                flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",year:2024,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"620",name:"Portugal",                  flag:"🇵🇹",year:2024,continent:"Europa", showYear:true, pixiesetUrl:"#"},
  {id:"792",name:"Turquía",                   flag:"🇹🇷",year:2013,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"156",name:"China",                     flag:"🇨🇳",year:2015,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"344",name:"Hong Kong",                 flag:"🇭🇰",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"704",name:"Vietnam",                   flag:"🇻🇳",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"116",name:"Camboya",                   flag:"🇰🇭",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"418",name:"Laos",                      flag:"🇱🇦",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"764",name:"Tailandia",                 flag:"🇹🇭",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"410",name:"Corea del Sur",             flag:"🇰🇷",year:2016,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"376",name:"Israel",        multi:true, flag:"🇮🇱",year:2018,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"275",name:"Palestina",                 flag:"🇵🇸",year:2018,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"356",name:"India",                     flag:"🇮🇳",year:2018,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"524",name:"Nepal",                     flag:"🇳🇵",year:2018,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"702",name:"Singapur",                  flag:"🇸🇬",year:2019,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"158",name:"Taiwán",                    flag:"🇹🇼",year:2019,continent:"Asia",   showYear:true, pixiesetUrl:"#"},
  {id:"170",name:"Colombia",      multi:true, flag:"🇨🇴",year:2024,continent:"América",showYear:false,pixiesetUrl:"#"},
  {id:"484",name:"México",                    flag:"🇲🇽",year:2016,continent:"América",showYear:true, pixiesetUrl:"#"},
  {id:"032",name:"Argentina",                 flag:"🇦🇷",year:2021,continent:"América",showYear:true, pixiesetUrl:"#"},
  {id:"840",name:"Estados Unidos",multi:true, flag:"🇺🇸",year:2024,continent:"América",showYear:true, pixiesetUrl:"#"},
  {id:"036",name:"Australia",                 flag:"🇦🇺",year:2019,continent:"Oceanía",showYear:true, pixiesetUrl:"#"},
];

const RATIOS=["800/600","600/800","700/700","900/600","600/900","800/500","500/800","750/750","900/700","600/750","800/450","450/800"];
const REAL_PHOTOS = {
  "170": [
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images2_i6zjvm",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images4_vh0rrs",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images5_k7z3hw",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images3_j0ezkx",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images7_clrteg",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images6_c45hjd",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images8_d9lmyl",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images_hnefqy",
    "https://res.cloudinary.com/deb88gq1x/image/upload/q_auto,f_auto/images9_fuomxy"
  ],
};
const PHOTOS=Object.fromEntries(VISITED.map(v=>[v.id, REAL_PHOTOS[v.id] || Array.from({length:12},(_,i)=>{const[w,h]=RATIOS[i%RATIOS.length].split("/");return `https://picsum.photos/seed/${v.name.toLowerCase().replace(/\s/g,"")}${i+1}/${w}/${h}`;})]));

const CONT_PALETTES={
  "Europa":  ["#EDE5DD","#F5E5D5","#e0d8d0","#ccc4bc","#d8d0c8","#f0e8e0","#e8e0d8"],
  "Asia":    ["#b8b0a8","#c8c0b8","#a8a098","#d0c8c0","#b0a8a0","#c0b8b0","#bab2aa"],
  "América": ["#888078","#989088","#807870","#a0988e","#908880","#a8a098","#8a8278"],
  "Oceanía": ["#706860","#807870","#686058","#888078","#706860","#787068","#6e6660"],
};

function App(){
  const svgRef=useRef(null);
  const wrapRef=useRef(null);
  const [world,setWorld]=useState(null);
  const [mapW,setMapW]=useState(900);
  const [tip,setTip]=useState({on:false,x:0,y:0,label:"",id:null,clickable:false});
  const [active,setActive]=useState(null);
  const [imgErr,setImgErr]=useState({});
  const [lightbox,setLightbox]=useState(null);

  useEffect(() => {
    const handler = e => {
      if (e.key === 'Escape') {
        setLightbox(null);
        setActive(null);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  useEffect(()=>{
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(r=>r.json()).then(setWorld);
  },[]);

  useEffect(()=>{
    if(!wrapRef.current)return;
    const ro=new ResizeObserver(([e])=>setMapW(e.contentRect.width));
    ro.observe(wrapRef.current);
    return()=>ro.disconnect();
  },[]);

  useEffect(()=>{
    if(!world||!svgRef.current)return;
    const h=Math.round(mapW*0.52);
    const svg=d3.select(svgRef.current).attr("width",mapW).attr("height",h);
    svg.selectAll("*").remove();

    const proj=d3.geoEquirectangular().scale(mapW/6.4).translate([mapW/2,h*0.53]);
    const path=d3.geoPath().projection(proj);
    const raw=topojson.feature(world,world.objects.countries);

    const EUROPE_BOX={lngMin:-30,lngMax:55,latMin:35,latMax:72};
    const CLIP_IDS=new Set(["250"]);
    const polyCenter=coords=>{let sL=0,sA=0,c=0;coords[0].forEach(([l,a])=>{sL+=l;sA+=a;c++;});return[sL/c,sA/c];};
    const filterOverseas=feature=>{
      const id=String(feature.id).padStart(3,"0");
      if(!CLIP_IDS.has(id))return feature;
      const geom=feature.geometry;if(!geom)return feature;
      let polys=geom.type==="MultiPolygon"?geom.coordinates:[geom.coordinates];
      polys=polys.filter(coords=>{const[l,a]=polyCenter(coords);return l>=EUROPE_BOX.lngMin&&l<=EUROPE_BOX.lngMax&&a>=EUROPE_BOX.latMin&&a<=EUROPE_BOX.latMax;});
      if(polys.length===0)return null;
      return{...feature,geometry:{type:polys.length===1?"Polygon":"MultiPolygon",coordinates:polys.length===1?polys[0]:polys}};
    };
    const countries={...raw,features:raw.features.map(filterOverseas).filter(Boolean)};

    svg.append("rect").attr("width",mapW).attr("height",h).attr("fill","#0d0d0d");
    const g=svg.append("g");
    g.append("path").datum(d3.geoGraticule()()).attr("d",path).attr("fill","none").attr("stroke","rgba(80,110,160,0.07)").attr("stroke-width",0.5);

    const VISITED_MAP={};
    VISITED.forEach(v=>{VISITED_MAP[v.id]=v;});
    const fillMap={};const tempIdx={};
    VISITED.forEach(entry=>{
      const id=entry.id,cont=entry.continent;
      const pal=CONT_PALETTES[cont]||["#EDE5DD"];
      if(!(cont in tempIdx))tempIdx[cont]=0;
      fillMap[id]=pal[tempIdx[cont]%pal.length];
      tempIdx[cont]++;
    });
    const getFill=id=>fillMap[id]||"#1a1a1a";
    const getGlow=id=>fillMap[id]?`drop-shadow(0 0 3px ${fillMap[id]}99)`:"none";
    const getHov=id=>{const c=fillMap[id]||"#EDE5DD";const r=parseInt(c.slice(1,3),16),gg=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);const lx=v=>Math.min(255,Math.round(v+(255-v)*.38)).toString(16).padStart(2,"0");return`#${lx(r)}${lx(gg)}${lx(b)}`;};

    const nameMap={};
    countries.features.forEach(f=>{const id=String(f.id).padStart(3,"0");if(f.properties&&f.properties.name)nameMap[id]=f.properties.name;});

    g.selectAll("path.c").data(countries.features).enter().append("path")
      .attr("class","c").attr("d",path)
      .attr("fill",d=>{const id=String(d.id).padStart(3,"0");return VISITED_MAP[id]?getFill(id):"#1a1a1a";})
      .attr("stroke","#0d0d0d").attr("stroke-width",0.4)
      .style("cursor",d=>VISITED_MAP[String(d.id).padStart(3,"0")]?"pointer":"default")
      .style("filter",d=>{const id=String(d.id).padStart(3,"0");return VISITED_MAP[id]?getGlow(id):"none";})
      .on("mouseover",function(ev,d){
        const id=String(d.id).padStart(3,"0");
        const[x,y]=d3.pointer(ev,svgRef.current);
        if(VISITED_MAP[id]){
          d3.select(this).attr("fill",getHov(id)).style("filter",`drop-shadow(0 0 8px ${fillMap[id]}cc)`);
          setTip({on:true,x,y,label:`${VISITED_MAP[id].flag} ${VISITED_MAP[id].name}`,id,clickable:true});
        }else if(nameMap[id]){
          d3.select(this).attr("fill","#243448");
          setTip({on:true,x,y,label:nameMap[id],id:null,clickable:false});
        }
      })
      .on("mousemove",function(ev,d){
        const id=String(d.id).padStart(3,"0");
        if(!VISITED_MAP[id]&&!nameMap[id])return;
        const[x,y]=d3.pointer(ev,svgRef.current);
        setTip(t=>({...t,x,y}));
      })
      .on("mouseout",function(ev,d){
        const id=String(d.id).padStart(3,"0");
        d3.select(this).attr("fill",VISITED_MAP[id]?getFill(id):"#1a1a1a").style("filter",VISITED_MAP[id]?getGlow(id):"none");
        setTip(t=>({...t,on:false}));
      })
      .on("click",function(ev,d){
        const id=String(d.id).padStart(3,"0");
        if(VISITED_MAP[id]){setTip(t=>({...t,on:false}));setActive({id,country:VISITED_MAP[id]});}
      });

    const zoom=d3.zoom().scaleExtent([1,20]).translateExtent([[0,0],[mapW,h]])
      .on("zoom",ev=>{g.attr("transform",ev.transform);setTip(t=>({...t,on:false}));});
    svg.call(zoom).on("dblclick.zoom",()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity));

    [{label:"+",dy:0,action:()=>svg.transition().duration(300).call(zoom.scaleBy,1.6)},
     {label:"−",dy:32,action:()=>svg.transition().duration(300).call(zoom.scaleBy,0.625)},
     {label:"⟳",dy:72,action:()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity)},
    ].forEach(({label,dy,action})=>{
      const bg=svg.append("rect").attr("x",12).attr("y",h-130+dy).attr("width",28).attr("height",26).attr("rx",5).attr("fill","rgba(6,10,20,0.75)").attr("stroke","rgba(237,229,221,0.2)").style("cursor","pointer");
      const txt=svg.append("text").attr("x",26).attr("y",h-130+dy+17).attr("text-anchor","middle").attr("fill","#EDE5DD").attr("font-size","14px").attr("font-family","monospace").style("cursor","pointer").style("user-select","none").text(label);
      [bg,txt].forEach(el=>el.on("click",ev=>{ev.stopPropagation();action();}));
    });
  },[world,mapW]);

  const totalC=VISITED.length;
  const conts=[...new Set(VISITED.map(v=>v.continent))].length;

  return React.createElement("div",{style:{background:"#000",minHeight:"100vh",color:"#EDE5DD",fontFamily:"'Inter',system-ui,sans-serif",overflowX:"hidden"}},

    // HEADER
    React.createElement("header",{style:{padding:"3.5rem 2rem 2.5rem",textAlign:"center",borderBottom:"1px solid rgba(237,229,221,0.06)"}},
      React.createElement("div",{style:{display:"inline-block",marginBottom:"1rem"}},
        React.createElement("span",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"clamp(2rem,6vw,3.8rem)",fontWeight:900,color:"#EDE5DD",letterSpacing:"-0.02em",lineHeight:1}},"FLASH"),
        React.createElement("span",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"clamp(2rem,6vw,3.8rem)",fontWeight:900,color:"#444",letterSpacing:"-0.02em",lineHeight:1}},"BACK"),
        React.createElement("span",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"clamp(2rem,6vw,3.8rem)",fontWeight:900,color:"#EDE5DD",letterSpacing:"-0.02em",lineHeight:1}},"PACK")
      ),
      React.createElement("p",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"clamp(0.7rem,1.5vw,0.85rem)",fontWeight:400,color:"#3a3a3a",letterSpacing:"0.22em",textTransform:"uppercase",margin:0}},PROFILE.name)
    ),

    // STATS
    React.createElement("div",{style:{textAlign:"center",padding:"1.2rem 2rem",borderBottom:"1px solid rgba(237,229,221,0.06)"}},
      React.createElement("p",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"0.72rem",fontWeight:400,color:"#3a3a3a",letterSpacing:"0.18em",textTransform:"uppercase",margin:0}},
        `${totalC} países · ${conts} continentes · ${PROFILE.totalPhotos} fotos`
      )
    ),

    // MAPA
    React.createElement("div",{ref:wrapRef,style:{position:"relative",background:"#000"}},
      !world&&React.createElement("div",{style:{padding:"5rem",textAlign:"center",color:"#2e2b3d"}},"Cargando mapa…"),
      React.createElement("svg",{ref:svgRef,style:{display:"block",width:"100%"}}),
      tip.on&&React.createElement("div",{
        onClick:tip.clickable?()=>{const id=tip.id;setTip(t=>({...t,on:false}));setActive({id,country:VISITED.find(v=>v.id===id)});}:undefined,
        style:{position:"absolute",left:tip.x,top:tip.y,transform:"translateX(-50%) translateY(-120%)",background:"rgba(6,10,20,0.95)",border:"1px solid rgba(237,229,221,0.35)",borderRadius:"8px",padding:"0.45rem 0.9rem",fontSize:"0.82rem",color:"#EDE5DD",whiteSpace:"nowrap",backdropFilter:"blur(10px)",zIndex:10,pointerEvents:tip.clickable?"auto":"none",cursor:tip.clickable?"pointer":"default"}
      },tip.label+(tip.clickable?" →":"")),
      React.createElement("div",{style:{position:"absolute",bottom:"1rem",right:"1rem",display:"flex",gap:"1rem",fontSize:"0.65rem",color:"#9a9090",letterSpacing:"0.1em",textTransform:"uppercase"}},
        React.createElement("span",{style:{display:"flex",alignItems:"center",gap:"0.4rem"}},React.createElement("span",{style:{width:10,height:10,borderRadius:2,display:"inline-block",background:"#EDE5DD"}}),"Visitado"),
        React.createElement("span",{style:{display:"flex",alignItems:"center",gap:"0.4rem"}},React.createElement("span",{style:{width:10,height:10,borderRadius:2,display:"inline-block",background:"#1a1a1a"}}),"Por explorar")
      )
    ),

    // PASAPORTE
    React.createElement("div",{style:{padding:"2rem 2rem 3rem",borderTop:"1px solid rgba(237,229,221,0.06)"}},
      React.createElement("p",{style:{fontFamily:"'Inter',system-ui,sans-serif",fontSize:"0.62rem",color:"#3d3a50",letterSpacing:"0.22em",textTransform:"uppercase",marginBottom:"2rem"}},"Pasaporte"),
      ["Europa","Asia","América","Oceanía"].map(cont=>{
        const entries=VISITED.filter(v=>v.continent===cont);
        if(!entries.length)return null;
        return React.createElement("div",{key:cont,style:{marginBottom:"1.5rem"}},
          React.createElement("p",{style:{fontSize:"0.56rem",color:"#2e2b3d",letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:"0.7rem",fontFamily:"'Inter',system-ui,sans-serif"}},cont),
          React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:"0.1rem 0"}},
            entries.map(ctry=>React.createElement("button",{
              key:ctry.id,
              onClick:()=>setActive({id:ctry.id,country:ctry}),
              title:ctry.name,
              style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",background:"none",border:"none",cursor:"pointer",padding:"0.35rem 0.3rem",borderRadius:"6px",minWidth:"38px",fontFamily:"inherit",position:"relative"}
            },
              React.createElement("span",{style:{fontSize:"1.4rem",lineHeight:1}},ctry.flag),
              ctry.multi&&React.createElement("span",{style:{position:"absolute",top:"1px",right:"0px",fontSize:"9px",fontWeight:900,color:"#EDE5DD",fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",lineHeight:1,opacity:0.6}},"↵"),
              ctry.showYear&&React.createElement("span",{style:{fontSize:"0.56rem",color:"#EDE5DD",letterSpacing:"0.03em",opacity:0.55}},ctry.year)
            ))
          )
        );
      })
    ),

    // GALERÍA MODAL
    active&&React.createElement("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.94)",zIndex:1000,overflowY:"auto",animation:"fadeIn 0.2s ease"},
      onClick:()=>setActive(null)
    },
      React.createElement("div",{style:{maxWidth:"1200px",margin:"0 auto",padding:"2rem 1.5rem 4rem"},onClick:e=>e.stopPropagation()},
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:"rgba(0,0,0,0.92)",padding:"1rem 0",marginBottom:"1.5rem",zIndex:2,backdropFilter:"blur(8px)"}},
          React.createElement("div",null,
            React.createElement("h2",{style:{fontFamily:"'Helvetica Neue',Helvetica,Arial,sans-serif",fontSize:"1.4rem",fontWeight:900,color:"#EDE5DD",letterSpacing:"-0.01em",textTransform:"uppercase",margin:"0 0 0.15rem",lineHeight:1}},`${active.country.flag} ${active.country.name}`),
            React.createElement("p",{style:{fontSize:"0.6rem",color:"#3a3a3a",letterSpacing:"0.18em",textTransform:"uppercase",margin:0,fontFamily:"'Inter',system-ui,sans-serif"}},`${active.country.continent} · ${PHOTOS[active.id]?.length||0} fotos`)
          ),
          React.createElement("button",{onClick:()=>setActive(null),style:{background:"none",border:"0.5px solid rgba(237,229,221,0.15)",color:"#666",borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:"0.85rem",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",flexShrink:0}},"✕")
        ),
        React.createElement("div",{style:{columns:"3 200px",gap:"6px"}},
          PHOTOS[active.id]?.map((url,i)=>React.createElement("div",{
            key:i,
            style:{breakInside:"avoid",marginBottom:"6px",cursor:"zoom-in"},
            onClick:e=>{e.stopPropagation();setLightbox(url);}
          },
            React.createElement("img",{
              src:imgErr[`${active.id}-${i}`]?`https://picsum.photos/seed/${active.id}${i}/600/400`:url,
              alt:"",
              onError:()=>setImgErr(e=>({...e,[`${active.id}-${i}`]:true})),
              style:{width:"100%",display:"block",borderRadius:"4px",background:"#111"}
            })
          ))
        )
      )
    ),

    // LIGHTBOX
    lightbox&&React.createElement("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.97)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",cursor:"zoom-out",animation:"fadeIn 0.15s ease"},
      onClick:()=>setLightbox(null)
    },
      React.createElement("img",{src:lightbox,alt:"",style:{maxWidth:"92vw",maxHeight:"92vh",objectFit:"contain",borderRadius:"4px",display:"block"}}),
      React.createElement("button",{onClick:()=>setLightbox(null),style:{position:"absolute",top:"1.5rem",right:"1.5rem",background:"none",border:"0.5px solid rgba(237,229,221,0.2)",color:"#666",borderRadius:"50%",width:36,height:36,cursor:"pointer",fontSize:"1rem",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit"}},"✕")
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
